          - heading "Defends every layer of your AI stack" [level=2] [ref=f5e165]
          - paragraph [ref=f5e166]: The same loop, specialised for what each layer actually gets wrong. Pillars are what is under test — they are not the enforcement layers.
        - generic [ref=f5e167]:

              - listitem [ref=f5e179]: AML.T0051
          - article [ref=f5e180]:
            - heading "Agent" [level=3] [ref=f5e186]
            - paragraph [ref=f5e187]: Tools, memory, MCP surfaces and delegation. Goal hijack, tool misuse and memory poisoning stopped by an out-of-process authorizer and egress deny-lists the agent cannot talk its way past.

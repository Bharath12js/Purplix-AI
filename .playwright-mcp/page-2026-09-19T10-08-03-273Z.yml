            - heading "Model" [level=3] [ref=f5e174]
            - paragraph [ref=f5e175]: The model as deployed — system prompt, retrieval context and I/O handling. Prompt injection, canary leakage and unsafe output, closed by detection and structural defences rather than by more instructions.
